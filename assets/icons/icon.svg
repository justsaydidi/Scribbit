<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#1e3a5f"/>
  
  <!-- Scribbit base (cup shape) -->
  <path d="M362 420 L662 420 L632 750 C632 780 612 800 582 800 L442 800 C412 800 392 780 392 750 L362 420 Z" fill="#ffffff"/>
  
  <!-- Inkwell rim -->
  <ellipse cx="512" cy="420" rx="150" ry="40" fill="#2c4a6f"/>
  <ellipse cx="512" cy="420" rx="130" ry="30" fill="#1e3a5f"/>
  
  <!-- Ink inside -->
  <ellipse cx="512" cy="430" rx="110" ry="25" fill="#0f2744"/>
  
  <!-- Pen nib floating above -->
  <g transform="translate(512, 280) rotate(15)">
    <!-- Pen body -->
    <path d="M-15 0 L-8 120 L0 140 L8 120 L15 0 Z" fill="#e8e8e8"/>
    <!-- Pen tip -->
    <path d="M-8 120 L0 140 L8 120 Z" fill="#c0c0c0"/>
    <!-- Ink hole -->
    <circle cx="0" cy="110" r="3" fill="#1e3a5f"/>
  </g>
  
  <!-- Subtle shadow for depth -->
  <ellipse cx="512" cy="810" rx="140" ry="20" fill="#000000" opacity="0.2"/>
</svg>
